name: fopost
description: >-
  Official Dart SDK for the FoPost API. Schedule, publish and analyze social
  media posts across every connected platform, from Dart or Flutter.
version: 0.2.0
homepage: https://fopost.com
repository: https://github.com/fopost/fopost-dart
issue_tracker: https://github.com/fopost/fopost-dart/issues
documentation: https://fopost.com/docs

topics:
  - fopost
  - social-media
  - scheduling
  - publishing
  - analytics

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  http: ^1.2.0
  meta: ^1.12.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
